name: Aiming Overhaul release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Nexus Mods identifiers for the Aiming Overhaul mod page. NEXUS_MOD_ID is the internal ID that
  # v3/games/farcry2/mods/{id in the page URL} answers with, not the ID in the URL; the file ID is
  # on the mod's Files tab under "API Info". An empty file ID skips the upload.
  NEXUS_MOD_ID: '6317896892798'
  NEXUS_FILE_AIMING_OVERHAUL: '8096526'

jobs:
  release:
    # A 32-bit MSVC/CMake build (Far Cry 2 is a 32-bit process) - see mods/aiming-overhaul/build.ps1,
    # which this reuses as-is. It includes tools/FCSE/include, which is why the whole repository is
    # checked out rather than this folder alone.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mods/aiming-overhaul
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the release
        id: release
        uses: ./.github/actions/prepare-release
        with:
          directory: mods/aiming-overhaul
          tag_prefix: aiming-overhaul

      - name: Build AimingOverhaul.dll
        shell: pwsh
        # build.ps1 stages the DLL into layer\plugins\aiming-overhaul\.
        run: .\build.ps1 -Config release

      - name: Stage release contents
        shell: pwsh
        # A JackAll layer holding only plugins\, which both installers read as-is and JackAll deploys
        # into bin\plugins. README-release.md rather than README.md, which links to the docs by
        # relative path, dead once the file is alone inside a zip.
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'PowerShell 7+ is required - older Compress-Archive writes backslash entry paths, which no installer reads.' }
          Copy-Item "layer" "stage" -Recurse
          Copy-Item "README-release.md" "stage\README.md"
          if (-not (Test-Path "stage\plugins\aiming-overhaul\AimingOverhaul.dll")) { throw 'AimingOverhaul.dll was not staged - the zip would not be a layer.' }

      - name: Zip release artifact
        shell: pwsh
        run: Compress-Archive -Path "stage\*" -DestinationPath "aiming-overhaul-${{ steps.release.outputs.version }}.zip"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.release.outputs.tag }}" "aiming-overhaul-${{ steps.release.outputs.version }}.zip" --title "Aiming Overhaul ${{ steps.release.outputs.version }}" --target "${{ github.sha }}" --notes-file "${{ steps.release.outputs.notes_file }}"

      - name: Upload Aiming Overhaul to Nexus Mods
        uses: ./.github/actions/nexus-upload
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ env.NEXUS_MOD_ID }}
          file_id: ${{ env.NEXUS_FILE_AIMING_OVERHAUL }}
          filename: mods/aiming-overhaul/aiming-overhaul-${{ steps.release.outputs.version }}.zip
          version: ${{ steps.release.outputs.version }}
          display_name: Aiming Overhaul
          changelog: ${{ steps.release.outputs.nexus }}
          update_mod_version: 'true'
