name: Sound Overhaul release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # The Nexus mod page, once it exists: NEXUS_MOD_ID is the internal ID that v3/games/farcry2/mods/<id>
  # answers with, not the <id> in the URL; the file ID is on the mod's Files tab under "API Info". An
  # empty file ID skips the upload.
  NEXUS_MOD_ID: ''
  NEXUS_FILE_SOUND_OVERHAUL: ''

jobs:
  release:
    # A 32-bit MSVC/CMake build (Far Cry 2 is a 32-bit process) - see mods/sound-overhaul/build.ps1,
    # which this reuses as-is. Its first configure clones the Dear ImGui that mods/DevTools pins, which
    # is why the whole repository is checked out rather than this folder alone.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mods/sound-overhaul
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the release
        id: release
        uses: ./.github/actions/prepare-release
        with:
          directory: mods/sound-overhaul
          tag_prefix: sound-overhaul

      - name: Build SoundOverhaul.dll
        shell: pwsh
        # build.ps1 stages the DLL into layer\plugins\sound-overhaul\, beside the bundled DSOAL.
        run: .\build.ps1 -Config release

      - name: Stage release contents
        shell: pwsh
        # A JackAll layer, which both installers read as-is: mods\ is game data and plugins\ is what
        # JackAll deploys into bin\plugins. README-release.md rather than README.md, which links to
        # sibling folders by relative path, every one of which is dead once the file is alone inside a zip.
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'PowerShell 7+ is required - older Compress-Archive writes backslash entry paths, which no installer reads.' }
          Copy-Item "layer" "stage" -Recurse
          Copy-Item "README-release.md" "stage\README.md"
          if (-not (Test-Path "stage\mods")) { throw 'stage\mods is missing - the zip would not be a layer.' }
          if (-not (Test-Path "stage\plugins\sound-overhaul\SoundOverhaul.dll")) { throw 'SoundOverhaul.dll was not staged.' }

      - name: Zip release artifact
        shell: pwsh
        run: Compress-Archive -Path "stage\*" -DestinationPath "sound-overhaul-${{ steps.release.outputs.version }}.zip"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.release.outputs.tag }}" "sound-overhaul-${{ steps.release.outputs.version }}.zip" --title "Sound Overhaul ${{ steps.release.outputs.version }}" --target "${{ github.sha }}" --notes-file "${{ steps.release.outputs.notes_file }}"

      - name: Upload Sound Overhaul to Nexus Mods
        uses: ./.github/actions/nexus-upload
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ env.NEXUS_MOD_ID }}
          file_id: ${{ env.NEXUS_FILE_SOUND_OVERHAUL }}
          filename: mods/sound-overhaul/sound-overhaul-${{ steps.release.outputs.version }}.zip
          version: ${{ steps.release.outputs.version }}
          display_name: Sound Overhaul
          changelog: ${{ steps.release.outputs.nexus }}
          update_mod_version: 'true'
