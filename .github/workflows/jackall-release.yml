name: JackAll release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Nexus Mods identifiers for the JackAll mod page. NEXUS_MOD_ID is the internal ID that
  # v3/games/farcry2/mods/{id in the page URL} answers with, not the ID in the URL; each file ID is
  # on the mod's Files tab under "API Info". An empty file ID skips that artifact's upload.
  NEXUS_MOD_ID: '6317896892786'
  NEXUS_FILE_APP: '7850727'
  NEXUS_FILE_CLI: '7850730'

jobs:
  release:
    # net10.0-windows (JackAll.App, WPF) only builds on Windows.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/JackAll
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the release
        id: release
        uses: ./.github/actions/prepare-release
        with:
          directory: tools/JackAll
          tag_prefix: jackall

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish JackAll.App
        # Self-contained single-file win-x64 publish (see JackAll.App.csproj's _IsPublishing
        # group): output is just JackAll.exe plus data\ (hash dictionary, .fcb class config,
        # bundled ffmpeg.exe) - no loose DLLs, no .deps.json/.runtimeconfig.json, no config.ini
        # (that's only ever written by the app itself, at first run).
        run: dotnet publish src/JackAll.App/JackAll.App.csproj --configuration Release --runtime win-x64 --output publish/app

      - name: Publish JackAll.Cli
        # Same self-contained single-file deal as the App (see JackAll.Cli.csproj's _IsPublishing
        # group): output is jackall-cli.exe plus .itemhashes/.fcbclasses - no .NET runtime install
        # required.
        run: dotnet publish src/JackAll.Cli/JackAll.Cli.csproj --configuration Release --runtime win-x64 --output publish/cli

      - name: Zip release
        shell: pwsh
        run: |
          Compress-Archive -Path "publish\app\*" -DestinationPath "jackall-${{ steps.release.outputs.version }}.zip"
          Compress-Archive -Path "publish\cli\*" -DestinationPath "jackall-cli-${{ steps.release.outputs.version }}.zip"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.release.outputs.tag }}" "jackall-${{ steps.release.outputs.version }}.zip" "jackall-cli-${{ steps.release.outputs.version }}.zip" --title "JackAll ${{ steps.release.outputs.version }}" --target "${{ github.sha }}" --notes-file "${{ steps.release.outputs.notes_file }}"

      # Only this first upload carries the changelog and the mod version - the two are mod-wide, and
      # sending them twice would post the same entry twice.
      - name: Upload JackAll to Nexus Mods
        uses: ./.github/actions/nexus-upload
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ env.NEXUS_MOD_ID }}
          file_id: ${{ env.NEXUS_FILE_APP }}
          filename: tools/JackAll/jackall-${{ steps.release.outputs.version }}.zip
          version: ${{ steps.release.outputs.version }}
          display_name: JackAll Application
          changelog: ${{ steps.release.outputs.nexus }}
          update_mod_version: 'true'

      - name: Upload the JackAll CLI to Nexus Mods
        uses: ./.github/actions/nexus-upload
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ env.NEXUS_MOD_ID }}
          file_id: ${{ env.NEXUS_FILE_CLI }}
          filename: tools/JackAll/jackall-cli-${{ steps.release.outputs.version }}.zip
          version: ${{ steps.release.outputs.version }}
          display_name: JackAll CLI
