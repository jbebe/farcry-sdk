name: UFCP release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Nexus Mods identifiers for the UFCP mod page. NEXUS_MOD_ID is the internal ID that
  # v3/games/farcry2/mods/{id in the page URL} answers with, not the ID in the URL; the file ID is
  # on the mod's Files tab under "API Info". An empty file ID skips the upload.
  NEXUS_MOD_ID: '6317896892804'
  NEXUS_FILE_UFCP: '8140368'

jobs:
  release:
    # A 32-bit MSVC/CMake build (Far Cry 2 is a 32-bit process) - see mods/UFCP/build.ps1, which
    # this reuses as-is rather than re-deriving the vcvarsall dance.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mods/UFCP
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the release
        id: release
        uses: ./.github/actions/prepare-release
        with:
          directory: mods/UFCP
          tag_prefix: ufcp

      - name: Build UFCP.dll
        shell: pwsh
        # build.ps1 stages the DLL into layer\plugins\.
        run: .\build.ps1 -Config release

      - name: Verify the release build
        shell: pwsh
        # Architecture, static CRT and the FCSE_Load export: the three properties of this build that
        # fail *silently* - the DLL still builds, still loads on a dev machine, and only breaks on a
        # player's install, where the symptom is a plugin that is simply never there. See
        # verify_build.ps1 for what each check reads.
        run: .\verify_build.ps1 -Config release

      - name: Stage release contents
        shell: pwsh
        # A JackAll layer, which both installers read as-is: mods\ is the monocular's data, and
        # plugins\ is what JackAll deploys into bin\plugins. README-release.md rather than README.md,
        # which links to the docs by relative path, dead once the file is alone inside a zip.
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'PowerShell 7+ is required - older Compress-Archive writes backslash entry paths, which no installer reads.' }
          Copy-Item "layer" "stage" -Recurse
          Copy-Item "README-release.md" "stage\README.md"
          if (-not (Test-Path "stage\plugins\UFCP.dll")) { throw 'UFCP.dll was not staged - the zip would not be a layer.' }
          if (-not (Test-Path "stage\mods\worlds\world1\generated\entitylibrary.fcb\gadgets\Equipped\Monocular.xml")) { throw 'The monocular was not staged.' }

      - name: Zip release artifact
        shell: pwsh
        run: Compress-Archive -Path "stage\*" -DestinationPath "ufcp-${{ steps.release.outputs.version }}.zip"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.release.outputs.tag }}" "ufcp-${{ steps.release.outputs.version }}.zip" --title "UFCP ${{ steps.release.outputs.version }}" --target "${{ github.sha }}" --notes-file "${{ steps.release.outputs.notes_file }}"

      - name: Upload UFCP to Nexus Mods
        uses: ./.github/actions/nexus-upload
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ env.NEXUS_MOD_ID }}
          file_id: ${{ env.NEXUS_FILE_UFCP }}
          filename: mods/UFCP/ufcp-${{ steps.release.outputs.version }}.zip
          version: ${{ steps.release.outputs.version }}
          display_name: UFCP
          changelog: ${{ steps.release.outputs.nexus }}
          update_mod_version: 'true'

      - name: Update the Nexus Mods page
        shell: pwsh
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        # The page's summary and description from assets\, going out with the version they describe.
        run: ${{ github.workspace }}/scripts/nexus-page.ps1 -Project mods/UFCP
