name: Vortex extension release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Nexus Mods identifiers for the extension. It sits under the site domain, which is game 2295 in
  # the same ID space as any other - NEXUS_MOD_ID is (game_id << 32) | 2143, not the ID in the URL.
  # The file ID is on the Files tab under "API Info"; an empty one skips the upload.
  NEXUS_MOD_ID: '9856949946463'
  NEXUS_FILE_EXTENSION: '7736709'

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/vortex-farcry2
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the release
        id: release
        uses: ./.github/actions/prepare-release
        with:
          directory: tools/vortex-farcry2
          tag_prefix: vortex

      - name: Check info.json against the changelog
        shell: pwsh
        # info.json is what Vortex itself reads the version from, so shipping it out of step
        # with the changelog would number the extension differently from its own release.
        run: |
          $declared = (Get-Content info.json -Raw | ConvertFrom-Json).version
          if ($declared -ne "${{ steps.release.outputs.version }}") {
            throw "info.json declares $declared but the changelog releases ${{ steps.release.outputs.version }}."
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build
        run: pwsh ./build.ps1

      - name: Smoke test
        run: npm test

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.release.outputs.tag }}" "vortex-farcry2-${{ steps.release.outputs.version }}.zip" --title "Vortex Far Cry 2 extension ${{ steps.release.outputs.version }}" --target "${{ github.sha }}" --notes-file "${{ steps.release.outputs.notes_file }}"

      - name: Upload the extension to Nexus Mods
        uses: ./.github/actions/nexus-upload
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ env.NEXUS_MOD_ID }}
          file_id: ${{ env.NEXUS_FILE_EXTENSION }}
          filename: tools/vortex-farcry2/vortex-farcry2-${{ steps.release.outputs.version }}.zip
          version: ${{ steps.release.outputs.version }}
          display_name: Vortex Farcry2
          changelog: ${{ steps.release.outputs.nexus }}
          update_mod_version: 'true'
