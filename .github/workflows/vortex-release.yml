name: Vortex extension release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/vortex-farcry2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Read the version from info.json
        # info.json is what Vortex reads the version from, so it's the single source of truth -
        # the tag and release are derived from it instead of taken as a separate input.
        id: version
        shell: pwsh
        run: |
          $info = Get-Content info.json -Raw | ConvertFrom-Json
          "version=$($info.version)" >> $env:GITHUB_OUTPUT

      - name: Fail if the tag already exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "vortex-${{ steps.version.outputs.version }}"
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($existing) {
            Write-Error "Tag $tag already exists - bump the version in info.json before releasing."
            exit 1
          }

      - name: Build
        run: pwsh ./build.ps1

      - name: Smoke test
        run: npm test

      - name: Tag and publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "vortex-${{ steps.version.outputs.version }}"
          gh release create $tag "vortex-farcry2-${{ steps.version.outputs.version }}.zip" --target "${{ github.sha }}" --title "Vortex Far Cry 2 extension ${{ steps.version.outputs.version }}" --generate-notes
