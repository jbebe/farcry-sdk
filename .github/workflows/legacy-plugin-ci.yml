name: Legacy Plugin build

on:
  push:
    branches: [main]
    paths:
      - 'mods/legacy-plugin/**'
      # The plugin ABI: a change to it breaks every plugin built against the old one.
      - 'tools/FCSE/include/fcse_api.h'
      - '.github/workflows/legacy-plugin-ci.yml'
  pull_request:
    paths:
      - 'mods/legacy-plugin/**'
      - 'tools/FCSE/include/fcse_api.h'
      - '.github/workflows/legacy-plugin-ci.yml'

permissions:
  contents: read

jobs:
  build:
    # A 32-bit MSVC/CMake build, through the project's own build.ps1. Byte patterns need the game,
    # so scripts/verify_patterns.py runs locally rather than here.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mods/legacy-plugin
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: .\build.ps1 -Config release

      - name: Verify the build
        shell: pwsh
        run: .\verify_build.ps1 -Config release
