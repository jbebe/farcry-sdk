name: FCSE release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version - used as the git tag (fcse-{version}) and as fcse-{version}.zip'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # FCSE.exe and its plugins are 32-bit MSVC/CMake builds (Far Cry 2 is a 32-bit process) - see
    # tools/FCSE/build.ps1, which this reuses as-is rather than re-deriving the vcvarsall dance.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/FCSE
    steps:
      - uses: actions/checkout@v4

      # FCSE's settings-page layouts are built from assets/*.mgb.xml by tools/JackAll's CLI during
      # the CMake build (see the fcse_build_mgb note in tools/FCSE/CMakeLists.txt), so the .NET SDK
      # is a build prerequisite here exactly as the MSVC toolchain is.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and test FCSE.exe and the example plugin
        shell: pwsh
        # -Tests runs tests/ini_file_tests.cpp through ctest (see build.ps1). It's the one piece
        # here that runs with no game attached, and its failure mode is silently mangling a
        # player's fcse.ini, so a release shouldn't go out without it.
        run: .\build.ps1 -Config release -Tests

      - name: Verify the release build
        shell: pwsh
        # Static CRT and the embedded layouts/Lua runtime: the two properties of this build that fail
        # *silently* - the exe still builds, still runs on a dev machine, and only breaks on a
        # player's install - so they're gated here instead of left to a manual pass before each
        # release. See verify_build.ps1 for what each check reads out of the image and why; the same
        # script runs on every push and pull request from fcse-ci.yml, so a release is not the first
        # place either failure would be noticed.
        run: .\verify_build.ps1 -Config release

      - name: Stage release contents
        shell: pwsh
        # Three separate staging folders -> three separate zips (see the "Zip release artifacts" step
        # below): the main FCSE download, and two opt-in extras for anyone who wants a working
        # starting point - one for each way of writing a mod.
        #
        # The two extras are deliberately not merged: a compiled plugin and a Lua script have
        # entirely different prerequisites (an x86 MSVC toolchain vs. a text editor), and pairing
        # them in one download would imply the C++ one is a prerequisite for the other. It is not -
        # scripting exists precisely so a small change needs no compiler.
        run: |
          $build = "out\build\x86-release"

          New-Item -ItemType Directory -Force -Path "stage\fcse" | Out-Null
          Copy-Item "$build\FCSE.exe" "stage\fcse\FCSE.exe"
          Copy-Item "README-release.md" "stage\fcse\README.md"

          New-Item -ItemType Directory -Force -Path "stage\example-plugin" | Out-Null
          Copy-Item "$build\example_plugin\example_plugin.dll" "stage\example-plugin\example_plugin.dll"
          Copy-Item "example_plugin\example_plugin.cpp" "stage\example-plugin\example_plugin.cpp"
          Copy-Item "include\fcse_api.h" "stage\example-plugin\fcse_api.h"

          # Laid out as plugins\example_script.lua so the zip extracts straight into the game's bin\.
          # Lua mods share bin\plugins\ with the DLLs - one install location whatever a mod is
          # written in. Nothing is copied from the build tree: a script is not compiled, and the API
          # it calls into is already embedded in FCSE.exe as a resource.
          New-Item -ItemType Directory -Force -Path "stage\example-script\plugins" | Out-Null
          Copy-Item "example_script\example_script.lua" "stage\example-script\plugins\example_script.lua"

      - name: Zip release artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path "stage\fcse\*" -DestinationPath "fcse-${{ inputs.version }}.zip"
          Compress-Archive -Path "stage\example-plugin\*" -DestinationPath "fcse-example-plugin-${{ inputs.version }}.zip"
          Compress-Archive -Path "stage\example-script\*" -DestinationPath "fcse-example-script-${{ inputs.version }}.zip"

      - name: Tag and publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "fcse-${{ inputs.version }}" "fcse-${{ inputs.version }}.zip" "fcse-example-plugin-${{ inputs.version }}.zip" "fcse-example-script-${{ inputs.version }}.zip" --target "${{ github.sha }}" --title "FCSE ${{ inputs.version }}" --generate-notes
