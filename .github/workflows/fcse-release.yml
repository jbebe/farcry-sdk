name: FCSE release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # https://www.nexusmods.com/farcry2/mods/368. NEXUS_MOD_ID is the internal ID that
  # v3/games/farcry2/mods/368 answers with, not the 368 in the URL; each file ID is on the mod's
  # Files tab under "API Info". An empty file ID skips that artifact's upload.
  NEXUS_MOD_ID: '6317896892784'
  NEXUS_FILE_FCSE: '7791918'
  NEXUS_FILE_EXAMPLE: ''

jobs:
  release:
    # FCSE.exe and its plugins are 32-bit MSVC/CMake builds (Far Cry 2 is a 32-bit process) - see
    # tools/FCSE/build.ps1, which this reuses as-is rather than re-deriving the vcvarsall dance.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/FCSE
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the release
        id: release
        uses: ./.github/actions/prepare-release
        with:
          directory: tools/FCSE
          tag_prefix: fcse

      # FCSE's settings-page layouts are built from assets/*.mgb.xml by tools/JackAll's CLI during
      # the CMake build (see the fcse_build_mgb note in tools/FCSE/CMakeLists.txt), so the .NET SDK
      # is a build prerequisite here exactly as the MSVC toolchain is.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and test FCSE.exe and the example plugin
        shell: pwsh
        # -Tests runs every suite that needs no game attached (see build.ps1): the ini parser,
        # settings registry, pattern scanner, address library and Lua runtime.
        run: .\build.ps1 -Config release -Tests

      - name: Verify the release build
        shell: pwsh
        # Static CRT and the embedded layouts/Lua runtime: the two properties of this build that fail
        # *silently* - the exe still builds, still runs on a dev machine, and only breaks on a
        # player's install - so they're gated here instead of left to a manual pass before each
        # release. See verify_build.ps1 for what each check reads out of the image and why; the same
        # script runs on every push and pull request from fcse-ci.yml, so a release is not the first
        # place either failure would be noticed.
        run: .\verify_build.ps1 -Config release

      - name: Stage release contents
        shell: pwsh
        # Two zips: the FCSE download, and one opt-in example covering both ways of writing a mod.
        # Its plugins\ folder extracts straight into the game's bin\, where FCSE finds either form.
        run: |
          $build = "out\build\x86-release"

          New-Item -ItemType Directory -Force -Path "stage\fcse" | Out-Null
          Copy-Item "$build\FCSE.exe" "stage\fcse\FCSE.exe"
          Copy-Item "README-release.md" "stage\fcse\README.md"

          New-Item -ItemType Directory -Force -Path "stage\example\plugins" | Out-Null
          New-Item -ItemType Directory -Force -Path "stage\example\source" | Out-Null
          Copy-Item "$build\example_plugin\example_plugin.dll" "stage\example\plugins\example_plugin.dll"
          Copy-Item "example_script\example_script.lua" "stage\example\plugins\example_script.lua"
          Copy-Item "example_plugin\example_plugin.cpp" "stage\example\source\example_plugin.cpp"
          Copy-Item "include\fcse_api.h" "stage\example\source\fcse_api.h"

      - name: Zip release artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path "stage\fcse\*" -DestinationPath "fcse-${{ steps.release.outputs.version }}.zip"
          Compress-Archive -Path "stage\example\*" -DestinationPath "fcse-example-plugin-${{ steps.release.outputs.version }}.zip"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.release.outputs.tag }}" "fcse-${{ steps.release.outputs.version }}.zip" "fcse-example-plugin-${{ steps.release.outputs.version }}.zip" --title "FCSE ${{ steps.release.outputs.version }}" --target "${{ github.sha }}" --notes-file "${{ steps.release.outputs.notes_file }}"

      # Only this first upload carries the changelog and the mod version - the two are mod-wide, and
      # sending them twice would post the same entry twice.
      - name: Upload FCSE to Nexus Mods
        uses: ./.github/actions/nexus-upload
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ env.NEXUS_MOD_ID }}
          file_id: ${{ env.NEXUS_FILE_FCSE }}
          filename: tools/FCSE/fcse-${{ steps.release.outputs.version }}.zip
          version: ${{ steps.release.outputs.version }}
          display_name: FCSE
          changelog: ${{ steps.release.outputs.nexus }}
          update_mod_version: 'true'

      - name: Upload the example to Nexus Mods
        uses: ./.github/actions/nexus-upload
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ env.NEXUS_MOD_ID }}
          file_id: ${{ env.NEXUS_FILE_EXAMPLE }}
          filename: tools/FCSE/fcse-example-plugin-${{ steps.release.outputs.version }}.zip
          version: ${{ steps.release.outputs.version }}
          display_name: Example Plugins
          category: miscellaneous
