name: FCSE release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version - used as the git tag (fcse-{version}) and as fcse-{version}.zip'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # FCSE.exe and its plugins are 32-bit MSVC/CMake builds (Far Cry 2 is a 32-bit process) - see
    # tools/FCSE/build.ps1, which this reuses as-is rather than re-deriving the vcvarsall dance.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/FCSE
    steps:
      - uses: actions/checkout@v4

      - name: Build and test FCSE.exe and the example plugin
        shell: pwsh
        # -Tests runs tests/ini_file_tests.cpp through ctest (see build.ps1). It's the one piece
        # here that runs with no game attached, and its failure mode is silently mangling a
        # player's fcse.ini, so a release shouldn't go out without it.
        run: .\build.ps1 -Config release -Tests

      - name: Verify the release build
        shell: pwsh
        # Two properties of this build fail *silently* - the exe still builds, still runs on a dev
        # machine, and only breaks on a player's install - so they're gated here instead of left to
        # a manual pass before each release (both are in README.md's "Verification" section):
        #
        #   - Static CRT (/MT). If the CMP0091 setting stops applying, FCSE.exe imports
        #     MSVCP140/VCRUNTIME140/the UCRT apisets, and a player without the VS 2015-2022 x86
        #     redistributable gets a missing-DLL box before any of our code runs - no fcse.log,
        #     nothing to diagnose from.
        #   - The embedded .mgb layouts. A .rc added to a project without enable_language(RC) is
        #     skipped without a word, producing an FCSE.exe whose settings page has no layout.
        #
        # Both are read straight out of the built image rather than through dumpbin, which isn't on
        # PATH here - build.ps1 sets up the developer environment inside its own `cmd /c` and this
        # step doesn't inherit it. The CRT names and the RCDATA payloads are plain bytes in the
        # file; a static-CRT build contains none of the former (checked against a real build, not
        # assumed), and matching the payloads byte-for-byte also catches an embedded copy that went
        # stale against assets\.
        run: |
          $exePath = "out\build\x86-release\FCSE.exe"
          # 28591 = Latin-1: one byte <-> one char, so a byte search is a plain string search.
          $latin1 = [System.Text.Encoding]::GetEncoding(28591)
          $exe = $latin1.GetString([System.IO.File]::ReadAllBytes((Resolve-Path $exePath)))

          $crt = @("MSVCP140", "VCRUNTIME140", "api-ms-win-crt-", "ucrtbase") |
                 Where-Object { $exe.Contains($_) }
          if ($crt) {
            throw "$exePath links the dynamic CRT (found: $($crt -join ', ')) - it must build /MT. See the CMP0091 note in CMakeLists.txt."
          }

          # The Lua runtime is embedded the same way and fails the same way - a missing RCDATA
          # resource still builds and still launches, and only shows up as every script in the
          # install failing to require 'fcse'.
          foreach ($asset in "assets\fcse.mgb", "assets\fcse_widescreen.mgb", "src\lua\runtime\fcse.lua") {
            $payload = $latin1.GetString([System.IO.File]::ReadAllBytes((Resolve-Path $asset)))
            if ($exe.IndexOf($payload, [System.StringComparison]::Ordinal) -lt 0) {
              throw "$asset is not embedded in $exePath, or the embedded copy is stale - check that enable_language(RC) ran and that the generated fcse.rc reached the link."
            }
          }

          Write-Host "FCSE.exe: static CRT, both .mgb layouts and the Lua runtime embedded." -ForegroundColor Green

      - name: Stage release contents
        shell: pwsh
        # Three separate staging folders -> three separate zips (see the "Zip release artifacts" step
        # below): the main FCSE download, and two opt-in extras for anyone who wants a working
        # starting point - one for each way of writing a mod.
        #
        # The two extras are deliberately not merged: a compiled plugin and a Lua script have
        # entirely different prerequisites (an x86 MSVC toolchain vs. a text editor), and pairing
        # them in one download would imply the C++ one is a prerequisite for the other. It is not -
        # scripting exists precisely so a small change needs no compiler.
        run: |
          $build = "out\build\x86-release"

          New-Item -ItemType Directory -Force -Path "stage\fcse" | Out-Null
          Copy-Item "$build\FCSE.exe" "stage\fcse\FCSE.exe"
          Copy-Item "README-release.md" "stage\fcse\README.md"

          New-Item -ItemType Directory -Force -Path "stage\example-plugin" | Out-Null
          Copy-Item "$build\example_plugin\example_plugin.dll" "stage\example-plugin\example_plugin.dll"
          Copy-Item "example_plugin\example_plugin.cpp" "stage\example-plugin\example_plugin.cpp"
          Copy-Item "include\plugin_api.h" "stage\example-plugin\plugin_api.h"

          # Laid out as plugins\example_script.lua so the zip extracts straight into the game's bin\.
          # Lua mods share bin\plugins\ with the DLLs - one install location whatever a mod is
          # written in. Nothing is copied from the build tree: a script is not compiled, and the API
          # it calls into is already embedded in FCSE.exe as a resource.
          New-Item -ItemType Directory -Force -Path "stage\example-script\plugins" | Out-Null
          Copy-Item "example_script\example_script.lua" "stage\example-script\plugins\example_script.lua"

      - name: Zip release artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path "stage\fcse\*" -DestinationPath "fcse-${{ inputs.version }}.zip"
          Compress-Archive -Path "stage\example-plugin\*" -DestinationPath "fcse-example-plugin-${{ inputs.version }}.zip"
          Compress-Archive -Path "stage\example-script\*" -DestinationPath "fcse-example-script-${{ inputs.version }}.zip"

      - name: Tag and publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "fcse-${{ inputs.version }}"
          git push origin "fcse-${{ inputs.version }}"
          gh release create "fcse-${{ inputs.version }}" "fcse-${{ inputs.version }}.zip" "fcse-example-plugin-${{ inputs.version }}.zip" "fcse-example-script-${{ inputs.version }}.zip" --title "FCSE ${{ inputs.version }}" --generate-notes
