name: Vehicle Overhaul release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Nexus Mods identifiers for the Vehicle Overhaul mod page. NEXUS_MOD_ID is the internal ID that
  # v3/games/farcry2/mods/{id in the page URL} answers with, not the ID in the URL; the file ID is
  # on the mod's Files tab under "API Info". An empty file ID skips the upload.
  NEXUS_MOD_ID: ''
  NEXUS_FILE_VEHICLE_OVERHAUL: ''

jobs:
  release:
    # A 32-bit MSVC/CMake build (Far Cry 2 is a 32-bit process) - see mods/vehicle-overhaul/build.ps1,
    # which this reuses as-is. It includes tools/FCSE/include and DevTools' header, which is why the
    # whole repository is checked out rather than this folder alone.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mods/vehicle-overhaul
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the release
        id: release
        uses: ./.github/actions/prepare-release
        with:
          directory: mods/vehicle-overhaul
          tag_prefix: vehicle-overhaul

      - name: Build VehicleOverhaul.dll
        shell: pwsh
        # build.ps1 stages the DLL into layer\plugins\vehicle-overhaul\.
        run: .\build.ps1 -Config release

      - name: Stage release contents
        shell: pwsh
        # A JackAll layer, which both installers read as-is: mods\ is the game data and plugins\ is
        # what JackAll deploys into bin\plugins. README-release.md rather than README.md, which links
        # to the docs by relative path, dead once the file is alone inside a zip.
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'PowerShell 7+ is required - older Compress-Archive writes backslash entry paths, which no installer reads.' }
          Copy-Item "layer" "stage" -Recurse
          Copy-Item "README-release.md" "stage\README.md"
          if (-not (Test-Path "stage\plugins\vehicle-overhaul\VehicleOverhaul.dll")) { throw 'VehicleOverhaul.dll was not staged - the zip would not be a layer.' }

      - name: Zip release artifact
        shell: pwsh
        run: Compress-Archive -Path "stage\*" -DestinationPath "vehicle-overhaul-${{ steps.release.outputs.version }}.zip"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.release.outputs.tag }}" "vehicle-overhaul-${{ steps.release.outputs.version }}.zip" --title "Vehicle Overhaul ${{ steps.release.outputs.version }}" --target "${{ github.sha }}" --notes-file "${{ steps.release.outputs.notes_file }}"

      - name: Upload Vehicle Overhaul to Nexus Mods
        uses: ./.github/actions/nexus-upload
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ env.NEXUS_MOD_ID }}
          file_id: ${{ env.NEXUS_FILE_VEHICLE_OVERHAUL }}
          filename: mods/vehicle-overhaul/vehicle-overhaul-${{ steps.release.outputs.version }}.zip
          version: ${{ steps.release.outputs.version }}
          display_name: Vehicle Overhaul
          changelog: ${{ steps.release.outputs.nexus }}
          update_mod_version: 'true'

      - name: Update the Nexus Mods page
        shell: pwsh
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        # The page's summary and description from assets\, going out with the version they describe.
        run: ${{ github.workspace }}/scripts/nexus-page.ps1 -Project mods/vehicle-overhaul
