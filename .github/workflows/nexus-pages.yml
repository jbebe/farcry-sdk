name: Nexus Mods pages

# Sets one mod page's summary and description from its project's assets\ without a release, for a
# change to the page text alone. A release sets its own page as it goes out.
on:
  workflow_dispatch:
    inputs:
      project:
        description: The project directory whose page to set, such as mods/UFCP.
        required: true

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update the Nexus Mods pages
        shell: pwsh
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          PROJECT: ${{ inputs.project }}
        run: ./scripts/nexus-page.ps1 -Project $env:PROJECT
