name: Flashlight release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Empty until the Nexus mod page exists. NEXUS_MOD_ID is the internal ID that
  # v3/games/farcry2/mods/<id> answers with, not the ID in the URL; the file ID is on the mod's Files
  # tab under "API Info". An empty file ID skips the upload.
  NEXUS_MOD_ID: ''
  NEXUS_FILE_FLASHLIGHT: ''

jobs:
  release:
    # A 32-bit MSVC/CMake build (Far Cry 2 is a 32-bit process) - see mods/flashlight/build.ps1,
    # which this reuses as-is. It includes tools/FCSE/include, which is why the whole repository is
    # checked out rather than this folder alone.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: mods/flashlight
    steps:
      - uses: actions/checkout@v4

      - name: Prepare the release
        id: release
        uses: ./.github/actions/prepare-release
        with:
          directory: mods/flashlight
          tag_prefix: flashlight

      - name: Build Flashlight.dll
        shell: pwsh
        # build.ps1 stages the DLL into layer\plugins\flashlight\.
        run: .\build.ps1 -Config release

      - name: Stage release contents
        shell: pwsh
        # A JackAll layer, which both installers read as-is: mods\ is game data and plugins\ is what
        # JackAll deploys into bin\plugins. README-release.md rather than README.md, which links to
        # the docs by relative path, dead once the file is alone inside a zip.
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'PowerShell 7+ is required - older Compress-Archive writes backslash entry paths, which no installer reads.' }
          Copy-Item "layer" "stage" -Recurse
          Copy-Item "README-release.md" "stage\README.md"
          if (-not (Test-Path "stage\mods")) { throw 'stage\mods is missing - the zip would not be a layer.' }
          if (-not (Test-Path "stage\plugins\flashlight\Flashlight.dll")) { throw 'Flashlight.dll was not staged.' }

      - name: Zip release artifact
        shell: pwsh
        run: Compress-Archive -Path "stage\*" -DestinationPath "flashlight-${{ steps.release.outputs.version }}.zip"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.release.outputs.tag }}" "flashlight-${{ steps.release.outputs.version }}.zip" --title "Flashlight ${{ steps.release.outputs.version }}" --target "${{ github.sha }}" --notes-file "${{ steps.release.outputs.notes_file }}"

      - name: Upload Flashlight to Nexus Mods
        uses: ./.github/actions/nexus-upload
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ env.NEXUS_MOD_ID }}
          file_id: ${{ env.NEXUS_FILE_FLASHLIGHT }}
          filename: mods/flashlight/flashlight-${{ steps.release.outputs.version }}.zip
          version: ${{ steps.release.outputs.version }}
          display_name: Flashlight
          changelog: ${{ steps.release.outputs.nexus }}
          update_mod_version: 'true'
