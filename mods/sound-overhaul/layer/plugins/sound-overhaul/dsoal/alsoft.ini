# OpenAL Soft settings for Far Cry 2 through DSOAL. The plugin points ALSOFT_CONF here; the keys are
# documented in the alsoft.ini sample that ships with every DSOAL build.
[general]
# Plain stereo panning. Left unset, headphones switch HRTF on by themselves.
stereo-encoding = basic
# No output limiter: on by default, it squashes a close explosion's peaks. Under test (2026-09-29).
output-limiter = false
