schema_version = "1.0.0"

id = "farcry2_formats"
name = "Far Cry 2 Formats"
version = "0.1.0"
tagline = "Import and edit Far Cry 2 model packs"
maintainer = "FarCry2 modding tools"
type = "add-on"
license = ["SPDX:Unlicense"]
blender_version_min = "4.2.0"
tags = ["Import-Export"]

[permissions]
files = "Read and write .fc2model model packs"

# The corpus tests, the command-line scripts and the build script are not part of the add-on.
[build]
paths_exclude_pattern = [
    "__pycache__/",
    "/.git/",
    "/.gitignore",
    "*.zip",
    "/tests/",
    "/open_model.py",
    "/open_model.cmd",
    "/build.ps1",
]
